name: Verificar y publicar web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicacion-web
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar el sitio
        # Valida tipos y contenido de los cuentos, y genera dist/.
        run: npm run build
      - name: Comprobar el resultado
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/.htaccess
          test -s dist/es/index.html
          test -s dist/en/index.html
          test "$(find dist/es/cuentos -name index.html | wc -l)" -eq "$(find src/content/cuentos -name es.md | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: dist/
          include-hidden-files: true
          retention-days: 7

  publicar:
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: dist/
      - name: Configurar clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publicar en IONOS por SSH
        # La barra final de dist/ sube su contenido (no la carpeta) al destino.
        run: |
          rsync -av --no-perms --no-owner --no-group \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22' \
            dist/ \
            su502099@access-5019596432.webspace-host.com:/home/www/public/cuentos/
