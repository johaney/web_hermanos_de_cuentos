name: Verificar y publicar web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicacion-web
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar archivos del sitio
        run: |
          test -s index.html
          test -s hermanos-leyendo.png
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in html.lower()
          assert 'hermanos-leyendo.png' in html
          PY

  publicar:
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configurar clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publicar en IONOS por SSH
        run: |
          rsync -av --no-perms --no-owner --no-group \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22' \
            index.html hermanos-leyendo.png \
            su5020991@access-5019596432.webspace-host.com:/home/www/public/cuentos/
